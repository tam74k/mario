<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>الأخصائيات</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

<div class="topbar">
  <div class="container row-between" style="padding:14px 16px">
    <div class="brand">الأخصائيات</div>
    <div class="row">
      <a class="btn" href="dashboard.html">رجوع</a>
      <a class="btn" href="profile.html">البروفايل</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="sidebar-layout">
    <div class="card side">
      <div style="font-weight:900;margin-bottom:6px">لوحة الصالون</div>
      <div class="muted small" id="ctx"></div>
      <div class="hr"></div>
      <nav class="nav">
        <a href="dashboard.html">الحجوزات</a>
        <a href="services.html">الخدمات</a>
        <a class="active" href="specialists.html">الأخصائيات</a>
        <a href="settings.html">إعدادات الصالون</a>
      </nav>
    </div>

    <div class="grid">
      <!-- إضافة أخصائية -->
      <div class="card card-pad">
        <div style="font-weight:900">إضافة أخصائية</div>
        <div class="muted small">أدخل البيانات ثم اضغط إضافة.</div>
        <div class="hr"></div>

        <div class="grid grid-2">
          <div>
            <label class="label">الاسم</label>
            <input id="full_name" class="input" />
          </div>
          <div>
            <label class="label">المسمى (اختياري)</label>
            <input id="title" class="input" />
          </div>
          <div>
            <label class="label">الفرع</label>
            <select id="branch"></select>
          </div>
          <div>
            <label class="label">السعة / ساعة</label>
            <input id="cap" class="input" type="number" value="1" min="1" max="10" />
          </div>
          <div>
            <label class="label">صورة الأخصائية (اختياري)</label>
            <input id="img" class="input" type="file" accept="image/*" />
          </div>
        </div>

        <div style="height:12px"></div>
        <button id="btnAdd" class="btn btn-primary">إضافة</button>
      </div>

      <!-- القائمة -->
      <div class="card card-pad">
        <div class="row-between">
          <div style="font-weight:900">قائمة الأخصائيات</div>
          <button class="btn" id="btnReload">تحديث</button>
        </div>
        <div class="hr"></div>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer container">Saloneara Bookings</div>
<div class="toast"></div>

<script type="module">
  import { requireAuth, getUserKind } from "./assets/auth.js";
  import { sb } from "./assets/supabaseClient.js";
  import { toast, qs } from "./assets/ui.js";

  await requireAuth();
  const user = await getUserKind();
  if (user.kind !== "staff") {
    toast("غير مصرح بالدخول", "error");
    setTimeout(()=>location.href="profile.html",700);
  }

  qs("#ctx").textContent = `مرحبًا ${user.full_name ?? ""}`;

  const STAFF_BUCKET = "staff";

  async function loadBranches(){
    const { data } = await sb
      .from("branches")
      .select("id,name")
      .eq("salon_id", user.salon_id)
      .eq("is_active", true);

    qs("#branch").innerHTML = (data ?? [])
      .map(b=>`<option value="${b.id}">${b.name}</option>`)
      .join("");
  }

  async function uploadSpecialistImage(id, file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();

  // اسم ثابت + مسار واضح
  const path = `${user.salon_id}/${id}.${ext}`;

  // 1) رفع الملف (مع التحقق من الخطأ)
  const { error: upErr } = await sb.storage
    .from(STAFF_BUCKET)
    .upload(path, file, { upsert: true, contentType: file.type });

  if (upErr) throw upErr;

  // 2) بناء رابط public الصحيح (بدون الاعتماد على أي شيء قد يطلع غلط)
  // ملاحظة: SUPABASE_URL موجود في config.js عندك
  const { SUPABASE_URL } = await import("./assets/config.js");
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STAFF_BUCKET}/${path}`;

  // 3) تحديث image_url في جدول specialists
  const { error: dbErr } = await sb
    .from("specialists")
    .update({ image_url: publicUrl })
    .eq("id", id)
    .eq("salon_id", user.salon_id);

  if (dbErr) throw dbErr;

  return publicUrl;
}


  function card(s){
    const img = s.image_url
      ? `<img class="card-img" style="aspect-ratio:1/1" src="${s.image_url}">`
      : `<div class="card-img center muted" style="aspect-ratio:1/1">بدون صورة</div>`;

    return `
      <div class="card card-pad" style="margin-bottom:10px">
        <div class="grid grid-2">
          <div>${img}</div>
          <div>
            <div class="row-between">
              <div style="font-weight:900">${s.full_name}</div>
              <span class="pill">${s.is_active ? "نشطة" : "غير نشطة"}</span>
            </div>
            <div class="muted small">${s.title ?? ""}</div>
            <div class="muted small">سعة/ساعة: ${s.capacity_per_hour}</div>

            <div style="height:10px"></div>
            <button class="btn" data-toggle="${s.id}">
              ${s.is_active ? "تعطيل" : "تفعيل"}
            </button>

            <div style="height:10px"></div>
            <label class="label">تحديث الصورة</label>
            <input class="input" type="file" data-file="${s.id}" accept="image/*">
            <div style="height:6px"></div>
            <button class="btn btn-primary" data-up="${s.id}">رفع وحفظ</button>
          </div>
        </div>
      </div>
    `;
  }

  async function load(){
    const { data } = await sb
      .from("specialists")
      .select("*")
      .eq("salon_id", user.salon_id)
      .order("created_at", { ascending:false });

    qs("#list").innerHTML = (data ?? []).map(card).join("") || `<div class="muted">لا توجد أخصائيات.</div>`;

    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.toggle;
        const sp = data.find(x=>x.id===id);
        await sb.from("specialists").update({ is_active: !sp.is_active }).eq("id", id);
        toast("تم التحديث");
        load();
      };
    });

    document.querySelectorAll("[data-up]").forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.up;
        const file = document.querySelector(`[data-file="${id}"]`)?.files?.[0];
        if (!file) return toast("اختر صورة أولًا", "error");
        try{
          await uploadSpecialistImage(id, file);
          toast("تم تحديث الصورة");
          load();
        }catch{
          toast("تعذر رفع الصورة", "error");
        }
      };
    });
  }

  qs("#btnAdd").onclick = async ()=>{
    const full_name = qs("#full_name").value.trim();
    const branch_id = qs("#branch").value;
    if (!full_name || !branch_id) return toast("أكمل البيانات", "error");

    const { data } = await sb.from("specialists").insert({
      salon_id:user.salon_id,
      branch_id,
      full_name,
      title: qs("#title").value || null,
      capacity_per_hour: Number(qs("#cap").value||1),
      is_active:true
    }).select("id").single();

    const file = qs("#img").files?.[0];
    if (file) await uploadSpecialistImage(data.id, file);

    toast("تمت الإضافة");
    qs("#full_name").value = "";
    qs("#title").value = "";
    qs("#img").value = "";
    load();
  };

  qs("#btnReload").onclick = load;

  await loadBranches();
  load();
</script>
</body>
</html>
