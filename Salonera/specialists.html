<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>الأخصائيات</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

<div class="topbar">
  <div class="container row-between" style="padding:14px 16px">
    <div class="brand">الأخصائيات</div>
    <div class="row">
      <a class="btn" href="dashboard.html">رجوع</a>
      <a class="btn" href="profile.html">البروفايل</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="sidebar-layout">
    <div class="card side">
      <div style="font-weight:900;margin-bottom:6px">لوحة الصالون</div>
      <div class="muted small" id="ctx"></div>
      <div class="hr"></div>
      <nav class="nav">
        <a href="dashboard.html">الحجوزات</a>
        <a href="services.html">الخدمات</a>
        <a class="active" href="specialists.html">الأخصائيات</a>
        <a href="settings.html">إعدادات الصالون</a>
      </nav>
    </div>

    <div class="grid">
      <!-- إضافة أخصائية -->
      <div class="card card-pad">
        <div style="font-weight:900">إضافة أخصائية</div>
        <div class="muted small">أدخل البيانات ثم اضغط إضافة.</div>
        <div class="hr"></div>

        <div class="grid grid-2">
          <div>
            <label class="label">الاسم</label>
            <input id="full_name" class="input" />
          </div>
          <div>
            <label class="label">المسمى (اختياري)</label>
            <input id="title" class="input" />
          </div>
          <div>
            <label class="label">الفرع</label>
            <select id="branch"></select>
          </div>
          <div>
            <label class="label">السعة / ساعة</label>
            <input id="cap" class="input" type="number" value="1" min="1" max="10" />
          </div>
          <div>
            <label class="label">صورة الأخصائية (اختياري)</label>
            <input id="img" class="input" type="file" accept="image/*" />
          </div>
        </div>

        <div style="height:12px"></div>
        <button id="btnAdd" class="btn btn-primary">إضافة</button>
      </div>

      <!-- القائمة -->
      <div class="card card-pad">
        <div class="row-between">
          <div style="font-weight:900">قائمة الأخصائيات</div>
          <button class="btn" id="btnReload">تحديث</button>
        </div>
        <div class="hr"></div>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer container">Saloneara Bookings</div>
<div class="toast"></div>

<script type="module">
  import { requireAuth, getUserKind } from "./assets/auth.js";
  import { supabase as sb } from "./assets/supabaseClient.js";
  import { toast, qs } from "./assets/ui.js";
  import { SUPABASE_URL } from "./assets/config.js";

  await requireAuth();
  const user = await getUserKind();

  if (user.kind !== "staff") {
    toast("غير مصرح بالدخول", "error");
    setTimeout(()=>location.href="profile.html", 700);
  }

  qs("#ctx").textContent = `مرحبًا ${user.full_name ?? ""}`;

  const STAFF_BUCKET = "staff";

  function safeText(v){ return (v ?? "").toString().trim(); }

  // يدعم حالتين:
  // - image_url رابط كامل
  // - image_url path داخل bucket
  function toPublicImageUrl(v){
    const x = safeText(v);
    if (!x) return "";
    if (x.startsWith("http://") || x.startsWith("https://")) return x;
    return `${SUPABASE_URL}/storage/v1/object/public/${STAFF_BUCKET}/${x}`;
  }

  async function loadBranches(){
    const { data, error } = await sb
      .from("branches")
      .select("id,name")
      .eq("salon_id", user.salon_id)
      .eq("is_active", true)
      .order("created_at", { ascending: true });

    if (error) {
      toast("تعذر تحميل الفروع الآن", "error");
      return;
    }

    const rows = data ?? [];
    qs("#branch").innerHTML = rows.map(b=>`<option value="${b.id}">${b.name}</option>`).join("");

    if (!rows.length) {
      qs("#branch").innerHTML = `<option value="">لا يوجد فروع</option>`;
    }
  }

  // نرفع ثم نخزن PATH فقط (الأضمن)
  async function uploadSpecialistImage(id, file){
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${user.salon_id}/${id}.${ext}`;

    const { error: upErr } = await sb.storage
      .from(STAFF_BUCKET)
      .upload(path, file, { upsert: true, contentType: file.type });

    if (upErr) throw upErr;

    const { error: dbErr } = await sb
      .from("specialists")
      .update({ image_url: path })
      .eq("id", id)
      .eq("salon_id", user.salon_id);

    if (dbErr) throw dbErr;

    return path;
  }

  function card(s){
    const url = toPublicImageUrl(s.image_url);
    const img = url
      ? `<img class="card-img" style="aspect-ratio:1/1" src="${url}" alt="صورة">`
      : `<div class="card-img center muted" style="aspect-ratio:1/1">بدون صورة</div>`;

    const statusPill = s.is_active
      ? `<span class="pill">نشطة</span>`
      : `<span class="pill">غير نشطة</span>`;

    return `
      <div class="card card-pad" style="margin-bottom:10px">
        <div class="grid grid-2">
          <div>${img}</div>

          <div>
            <div class="row-between">
              <div style="font-weight:900;font-size:18px;line-height:1.2">${safeText(s.full_name)}</div>
              ${statusPill}
            </div>

            <div class="muted small">${safeText(s.title)}</div>
            <div class="muted small">سعة/ساعة: ${Number(s.capacity_per_hour || 1)}</div>

            <div style="height:10px"></div>

            <button class="btn" data-toggle="${s.id}">
              ${s.is_active ? "تعطيل" : "تفعيل"}
            </button>

            <div style="height:12px"></div>
            <div style="font-weight:900;margin-bottom:6px">تحديث الصورة</div>
            <input class="input" type="file" data-file="${s.id}" accept="image/*">
            <div style="height:6px"></div>
            <button class="btn btn-primary" data-up="${s.id}">رفع وحفظ</button>
          </div>
        </div>
      </div>
    `;
  }

  async function load(){
    const { data, error } = await sb
      .from("specialists")
      .select("id,full_name,title,capacity_per_hour,is_active,image_url,created_at")
      .eq("salon_id", user.salon_id)
      .order("created_at", { ascending:false });

    if (error) {
      qs("#list").innerHTML = `<div class="muted">تعذر تحميل القائمة الآن.</div>`;
      return;
    }

    const rows = data ?? [];
    qs("#list").innerHTML = rows.length ? rows.map(card).join("") : `<div class="muted">لا توجد أخصائيات.</div>`;

    // تفعيل / تعطيل
    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.getAttribute("data-toggle");
        const sp = rows.find(x => x.id === id);
        if (!sp) return;

        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = "جارٍ التحديث...";

        try{
          const { error: upErr } = await sb
            .from("specialists")
            .update({ is_active: !sp.is_active })
            .eq("id", id)
            .eq("salon_id", user.salon_id);

          if (upErr) throw upErr;

          toast(!sp.is_active ? "تم التفعيل" : "تم التعطيل");
          load();
        }catch{
          toast("تعذر تنفيذ العملية. حاول مرة أخرى.", "error");
        }finally{
          btn.disabled = false;
          btn.textContent = oldText;
        }
      });
    });

    // رفع الصورة
    document.querySelectorAll("[data-up]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.getAttribute("data-up");
        const input = document.querySelector(`[data-file="${id}"]`);
        const file = input?.files?.[0];
        if (!file) return toast("اختر صورة أولًا", "error");

        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = "جارٍ الرفع...";

        try{
          await uploadSpecialistImage(id, file);
          toast("تم تحديث الصورة");
          load();
        }catch{
          toast("تعذر رفع الصورة. حاول مرة أخرى.", "error");
        }finally{
          btn.disabled = false;
          btn.textContent = oldText;
          if (input) input.value = "";
        }
      });
    });
  }

  qs("#btnAdd").addEventListener("click", async ()=>{
    const full_name = qs("#full_name").value.trim();
    const branch_id = qs("#branch").value;
    const cap = Number(qs("#cap").value || 1);

    if (!full_name || !branch_id) return toast("أكمل البيانات", "error");
    if (!cap || cap < 1) return toast("السعة غير صحيحة", "error");

    const btn = qs("#btnAdd");
    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = "جارٍ الإضافة...";

    try{
      const { data, error } = await sb
        .from("specialists")
        .insert({
          salon_id: user.salon_id,
          branch_id,
          full_name,
          title: qs("#title").value?.trim() || null,
          capacity_per_hour: cap,
          is_active: true
        })
        .select("id")
        .single();

      if (error || !data?.id) throw (error || new Error("failed"));

      const file = qs("#img").files?.[0];
      if (file) {
        await uploadSpecialistImage(data.id, file);
      }

      toast("تمت الإضافة");
      qs("#full_name").value = "";
      qs("#title").value = "";
      qs("#img").value = "";
      qs("#cap").value = "1";
      load();
    }catch{
      toast("تعذر إضافة الأخصائية. حاول مرة أخرى.", "error");
    }finally{
      btn.disabled = false;
      btn.textContent = oldText;
    }
  });

  qs("#btnReload").addEventListener("click", load);

  await loadBranches();
  load();
</script>

</body>
</html>
