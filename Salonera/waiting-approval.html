<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بانتظار التفعيل</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

<div class="topbar">
  <div class="container row-between" style="padding:14px 16px">
    <div class="brand">بانتظار التفعيل</div>
    <div class="row">
      <a class="btn" href="profile.html">حسابي</a>
      <a class="btn btn-link" href="index.html">الرئيسية</a>
    </div>
  </div>
</div>

<div class="container full-height center">
  <div class="auth-wrap card card-pad">
    <h2>حساب الصالون قيد المراجعة</h2>
    <div class="muted small">
      سيتم تفعيل حساب الصالون قريبًا بعد مراجعة البيانات.
    </div>

    <div class="hr"></div>
    <div id="status" class="muted small">جارٍ التحقق من الحالة...</div>

    <div style="height:12px"></div>
    <button class="btn" id="btnRefresh">تحديث</button>
  </div>
</div>

<div class="footer container">Saloneara Bookings</div>
<div class="toast"></div>

<script type="module">
  import { requireAuth, getUserKind } from "./assets/auth.js";
  import { sb } from "./assets/supabaseClient.js";
  import { toast, qs } from "./assets/ui.js";

  await requireAuth();
  const user = await getUserKind();

  async function checkStatus(){
    try{
      const { data } = await sb.from("salons")
        .select("account_status")
        .eq("id", user.salon_id)
        .single();

      if (data?.account_status === "active"){
        toast("تم تفعيل الصالون");
        setTimeout(()=>location.href="dashboard.html",700);
      } else {
        qs("#status").textContent = "الحساب ما زال قيد المراجعة.";
      }
    }catch{
      qs("#status").textContent = "تعذر التحقق من الحالة الآن.";
    }
  }

  qs("#btnRefresh").onclick = checkStatus;
  checkStatus();
</script>

</body>
</html>
