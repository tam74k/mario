<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تعيين كلمة مرور جديدة</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="container row-between" style="padding:14px 16px">
      <div class="brand">PremiumVIP Booking</div>
      <div class="row"><span class="badge">Reset</span></div>
    </div>
  </div>

  <div class="container full-height center">
    <div class="auth-wrap card card-pad">
      <h2 style="margin:0 0 6px 0">كلمة مرور جديدة</h2>
      <div class="muted small">اكتب كلمة المرور الجديدة ثم احفظ.</div>
      <div class="hr"></div>

      <label class="label">كلمة المرور الجديدة</label>
      <input id="p1" class="input" type="password" placeholder="••••••••" />

      <div style="height:10px"></div>

      <label class="label">تأكيد كلمة المرور</label>
      <input id="p2" class="input" type="password" placeholder="••••••••" />

      <div style="height:12px"></div>
      <button id="btnSave" class="btn btn-primary" style="width:100%">حفظ</button>
    </div>
  </div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";

    import { toast, qs } from "./assets/ui.js";

    

    qs("#btnSave").addEventListener("click", async () => {
      const p1 = qs("#p1").value;
      const p2 = qs("#p2").value;
      if (!p1 || p1.length < 6) return toast("كلمة المرور يجب أن تكون 6 أحرف على الأقل", "error");
      if (p1 !== p2) return toast("كلمتا المرور غير متطابقتين", "error");

      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) return toast(error.message, "error");

      toast("تم تحديث كلمة المرور");
      setTimeout(()=> location.href="login.html", 700);
    });
  </script>
  <div class="footer container">© PremiumVIP Booking — واجهة HTML/CSS/JS متصلة بـ Supabase</div>
  <div class="toast"></div>
</body>
</html>
