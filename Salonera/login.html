<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="container row-between" style="padding:14px 16px">
      <div class="brand">PremiumVIP Booking</div>
      <span class="badge">Auth</span>
    </div>
  </div>

  <div class="container full-height center">
    <div class="auth-wrap card card-pad">
      <div class="row-between" style="align-items:flex-end">
        <div>
          <h2 style="margin:0 0 6px 0">تسجيل الدخول</h2>
          <div class="muted small">اختر نوع الدخول ثم أدخل بياناتك.</div>
        </div>
        <a class="btn btn-link" href="register.html">إنشاء حساب</a>
      </div>

      <div class="hr"></div>

      <div class="row" style="gap:8px">
        <button class="btn" id="tabCustomer">دخول عميل</button>
        <button class="btn" id="tabSalon">دخول صالون/موظفين</button>
        <button class="btn" id="tabAdmin">دخول إدارة المنصة</button>
      </div>
      <div class="small muted" id="tabHint" style="margin-top:8px">الافتراضي: عميل.</div>

      <div style="height:12px"></div>

      <label class="label">البريد الإلكتروني</label>
      <input id="email" class="input" type="email" placeholder="name@email.com" />

      <div style="height:10px"></div>

      <label class="label">كلمة المرور</label>
      <input id="password" class="input" type="password" placeholder="••••••••" />

      <div style="height:10px"></div>

      <div class="row-between">
        <label class="checkbox">
          <input id="remember" type="checkbox" checked />
          تذكرني
        </label>
        <a class="btn btn-link" href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>

      <div style="height:12px"></div>

      <button id="btnLogin" class="btn btn-primary" style="width:100%">دخول</button>

      <div style="height:10px"></div>
      <div class="small muted">
        إذا كان حساب الصالون “بانتظار الموافقة” سيتم تحويلك لصفحة الانتظار.
      </div>
    </div>
  </div>

  <div class="toast"></div>

  <script type="module">
    import { supabase } from "./assets/supabaseClient.js";
    import { toast, qs } from "./assets/ui.js";
    import { getUserKind } from "./assets/auth.js";

    const sb = supabase();
    let target = "customer";

    const hint = qs("#tabHint");
    function setTab(t){
      target = t;
      const map = {
        customer: "للدخول كعميل (حجوزاتك).",
        salon: "للدخول كصالون/موظفين (الداشبورد).",
        admin: "للدخول كإدارة المنصة (متابعة الصالونات والعملاء)."
      };
      hint.textContent = map[t] || map.customer;
    }

    qs("#tabCustomer").addEventListener("click", ()=>setTab("customer"));
    qs("#tabSalon").addEventListener("click", ()=>setTab("salon"));
    qs("#tabAdmin").addEventListener("click", ()=>setTab("admin"));
    setTab("customer");

    qs("#btnLogin").addEventListener("click", async () => {
      const email = qs("#email").value.trim();
      const password = qs("#password").value;
      const remember = qs("#remember").checked;
      localStorage.setItem("pv_remember", remember ? "1" : "0");
      if (!email || !password) return toast("أدخل البريد وكلمة المرور", "error");

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return toast(error.message, "error");

      const u = await getUserKind();

      let isAdmin = false;
      try{
        const { data: adminRow } = await sb.from("platform_admins").select("user_id").eq("user_id", u.user_id).maybeSingle();
        isAdmin = !!adminRow;
      }catch{}

      if (target === "admin" && !isAdmin){
        toast("هذا الحساب ليس إدارة منصة", "error");
        return;
      }

      if (target === "customer") return location.href = "my-bookings.html";

      if (target === "salon"){
        try{
          const { data: salon } = await sb.from("salons").select("id,account_status").eq("id", u.salon_id).single();
          if (salon?.account_status && salon.account_status !== "active"){
            return location.href = "waiting-approval.html";
          }
        }catch{}
        return location.href = "dashboard.html";
      }

      if (target === "admin") return location.href = "admin.html";
    });
  </script>
</body>
</html>
