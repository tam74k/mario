<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تفاصيل الصالون</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="container row-between" style="padding:14px 16px">
      <div class="brand">تفاصيل الصالون</div>
      <div class="row">
        <a class="btn" href="index.html">رجوع</a>
        <a class="btn" href="profile.html">حسابي</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="salonCard" class="card card-pad"></div>

    <div style="height:12px"></div>

    <div class="grid grid-2">
      <div class="card card-pad">
        <div style="font-weight:900;margin-bottom:8px">الخدمات</div>
        <div id="services" class="grid"></div>
      </div>

      <div class="card card-pad">
        <div style="font-weight:900;margin-bottom:8px">الأخصائيات</div>
        <div id="specialists" class="grid"></div>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="card card-pad">
      <div style="font-weight:900;margin-bottom:8px">بدء الحجز</div>
      <div class="muted small">اختر خدمة وأخصائية ثم انتقل للحجز.</div>

      <div style="height:10px"></div>
      <div class="grid grid-2">
        <div>
          <label class="label">الخدمة</label>
          <select id="serviceSelect"></select>
        </div>
        <div>
          <label class="label">الأخصائية</label>
          <select id="specialistSelect"></select>
        </div>
      </div>

      <div style="height:12px"></div>
      <button id="btnGo" class="btn btn-primary">متابعة للحجز</button>
    </div>
  </div>

  <div class="footer container">Saloneara Bookings</div>
  <div class="toast"></div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";
    import { toast, qs } from "./assets/ui.js";

    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");

    function money(v){
      try { return Number(v).toFixed(2); }
      catch { return v ?? ""; }
    }

    function safeUpper(v){
      return (v ?? "").toString().toUpperCase() || "—";
    }

    async function load(){
      if (!slug){
        toast("تعذر فتح الصفحة", "error");
        return;
      }

      // جلب بيانات الصالون + بيانات التواصل/الموقع (إن وجدت)
      const { data: salon, error: sErr } = await sb
        .from("salons")
        .select(`
          id,name,slug,image_url,timezone,vat_enabled,vat_rate,
          country_code,currency_code,language_default,
          salon_contacts(
            address_line,phone,whatsapp,
            country:countries(name_ar),
            region:regions(name_ar),
            city:cities(name_ar)
          )
        `)
        .eq("slug", slug)
        .single();

      if (sErr || !salon) {
        toast("لم يتم العثور على الصالون", "error");
        return;
      }

      const img = salon.image_url
        ? `<img class="card-img" src="${salon.image_url}" alt="صورة الصالون">`
        : `<div class="card-img center muted">بدون صورة</div>`;

      const countryCode = safeUpper(salon.country_code);
      const currency = safeUpper(salon.currency_code);
      const lang = safeUpper(salon.language_default);
      const timezone = salon.timezone ?? "—";

      const contact = Array.isArray(salon.salon_contacts) ? salon.salon_contacts[0] : salon.salon_contacts;
      const address = contact?.address_line || "";
      const phone = contact?.phone || "";
      const whatsapp = contact?.whatsapp || "";
      const countryName = contact?.country?.name_ar || "";
      const regionName = contact?.region?.name_ar || "";
      const cityName = contact?.city?.name_ar || "";

      const locationLine = [countryName, regionName, cityName].filter(Boolean).join(" • ");

      const contactHtml = (address || phone || whatsapp || locationLine)
        ? `
          <div style="height:10px"></div>
          <div class="muted small">
            ${locationLine ? `<div>${locationLine}</div>` : ``}
            ${address ? `<div>${address}</div>` : ``}
            ${(phone || whatsapp) ? `<div>${phone ? `هاتف: ${phone}` : ``} ${phone && whatsapp ? ` • ` : ``} ${whatsapp ? `واتساب: ${whatsapp}` : ``}</div>` : ``}
          </div>
        `
        : ``;

      qs("#salonCard").innerHTML = `
        <div class="grid grid-2">
          <div>${img}</div>
          <div>
            <div style="font-weight:900;font-size:20px">${salon.name ?? "صالون"}</div>
            <div class="muted small">${countryCode} • ${currency} • ${lang} • ${timezone}</div>
            ${contactHtml}
            <div style="height:10px"></div>
            <span class="pill">
              VAT: ${
                salon.vat_enabled
                  ? ((Number(salon.vat_rate ?? 0) * 100).toFixed(0) + "%")
                  : "غير مفعل"
              }
            </span>
          </div>
        </div>
      `;

      // الخدمات
      const { data: services, error: seErr } = await sb
        .from("services")
        .select("id,name_ar,price,duration_minutes,is_active")
        .eq("salon_id", salon.id)
        .eq("is_active", true)
        .order("created_at", { ascending:false });

      if (seErr) {
        toast("تعذر تحميل الخدمات", "error");
        return;
      }

      qs("#services").innerHTML = (services ?? []).length
        ? services.map(s => `
            <div class="card card-pad">
              <div style="font-weight:900">${s.name_ar ?? ""}</div>
              <div class="muted small">${money(s.price)} • ${s.duration_minutes ?? 0} دقيقة</div>
            </div>
          `).join("")
        : `<div class="muted">لا توجد خدمات.</div>`;

      // الأخصائيات
      const { data: specialists, error: spErr } = await sb
        .from("specialists")
        .select("id,full_name,title,capacity_per_hour,image_url,is_active")
        .eq("salon_id", salon.id)
        .eq("is_active", true)
        .order("created_at", { ascending:false });

      if (spErr) {
        toast("تعذر تحميل الأخصائيات", "error");
        return;
      }

      qs("#specialists").innerHTML = (specialists ?? []).length
        ? specialists.map(x => {
            const si = x.image_url
              ? `<img class="card-img" style="aspect-ratio:1/1" src="${x.image_url}" alt="صورة">`
              : `<div class="card-img center muted" style="aspect-ratio:1/1">بدون صورة</div>`;
            return `
              <div class="card card-pad">
                ${si}
                <div style="height:8px"></div>
                <div style="font-weight:900">${x.full_name ?? ""}</div>
                <div class="muted small">${x.title ?? ""}</div>
                <div style="height:8px"></div>
                <span class="pill">سعة/ساعة: ${x.capacity_per_hour ?? 1}</span>
              </div>
            `;
          }).join("")
        : `<div class="muted">لا توجد أخصائيات.</div>`;

      // selects
      const serviceSelect = qs("#serviceSelect");
      const specialistSelect = qs("#specialistSelect");

      serviceSelect.innerHTML = (services ?? []).map(s =>
        `<option value="${s.id}">${s.name_ar ?? ""} — ${money(s.price)} (${s.duration_minutes ?? 0}د)</option>`
      ).join("");

      specialistSelect.innerHTML = (specialists ?? []).map(s =>
        `<option value="${s.id}">${s.full_name ?? ""}</option>`
      ).join("");

      qs("#btnGo").addEventListener("click", () => {
        if (!serviceSelect.value || !specialistSelect.value) {
          toast("اختر خدمة وأخصائية أولًا", "error");
          return;
        }
        location.href =
          `book.html?salon_id=${salon.id}&service_id=${serviceSelect.value}&specialist_id=${specialistSelect.value}`;
      });
    }

    load();
  </script>
</body>
</html>
