<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>إعدادات الصالون</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

<div class="topbar">
  <div class="container row-between" style="padding:14px 16px">
    <div class="brand">إعدادات الصالون</div>
    <div class="row">
      <a class="btn" href="dashboard.html">رجوع</a>
      <a class="btn" href="profile.html">البروفايل</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="sidebar-layout">

    <div class="card side">
      <div style="font-weight:900;margin-bottom:6px">لوحة الصالون</div>
      <div class="muted small" id="ctx"></div>
      <div class="hr"></div>
      <nav class="nav">
        <a href="dashboard.html">الحجوزات</a>
        <a href="services.html">الخدمات</a>
        <a href="specialists.html">الأخصائيات</a>
        <a class="active" href="settings.html">الإعدادات</a>
      </nav>
    </div>

    <div class="grid">

      <!-- صورة الصالون -->
      <div class="card card-pad">
        <div style="font-weight:900">صورة الصالون</div>
        <div class="muted small">ستظهر هذه الصورة للعملاء في صفحة الصالون.</div>
        <div class="hr"></div>

        <div id="salonImgWrap"></div>
        <div style="height:10px"></div>
        <input id="salonImg" type="file" accept="image/*" class="input">
        <div style="height:10px"></div>
        <button id="btnUploadSalon" class="btn btn-primary">رفع الصورة</button>
      </div>

      <!-- إعدادات الحجز -->
      <div class="card card-pad">
        <div style="font-weight:900">إعدادات الحجز</div>
        <div class="muted small">تحكم في طريقة استقبال الحجوزات.</div>
        <div class="hr"></div>

        <div class="grid grid-2">
          <div>
            <label class="label">تأكيد تلقائي للحجوزات</label>
            <select id="auto_confirm">
              <option value="false">لا</option>
              <option value="true">نعم</option>
            </select>
          </div>
          <div>
            <label class="label">الحد الأدنى قبل الموعد (بالساعات)</label>
            <input id="min_booking_hours" class="input" type="number">
          </div>
          <div>
            <label class="label">الإلغاء مسموح قبل (بالساعات)</label>
            <input id="cancel_before_hours" class="input" type="number">
          </div>
          <div>
            <label class="label">مدة الفاصل الزمني</label>
            <select id="slot_step_minutes">
              <option>30</option>
              <option>15</option>
              <option>10</option>
              <option>60</option>
            </select>
          </div>
        </div>

        <div style="height:12px"></div>
        <button id="btnSaveSettings" class="btn btn-primary">حفظ الإعدادات</button>
      </div>

    </div>
  </div>
</div>

<div class="footer container">Saloneara Bookings</div>
<div class="toast"></div>

<script type="module">
  import { requireAuth, getUserKind } from "./assets/auth.js";
  import { sb } from "./assets/supabaseClient.js";
  import { toast, qs } from "./assets/ui.js";

  await requireAuth();
  const user = await getUserKind();

  if (user.kind !== "staff") {
    toast("غير مصرح بالدخول لهذه الصفحة", "error");
    setTimeout(()=>location.href="profile.html", 700);
  }

  qs("#ctx").textContent = `مرحبًا ${user.full_name || ""}`;

  async function loadSalon(){
    const { data } = await sb.from("salons")
      .select("image_url")
      .eq("id", user.salon_id)
      .single();

    qs("#salonImgWrap").innerHTML = data?.image_url
      ? `<img class="card-img" src="${data.image_url}">`
      : `<div class="card-img center muted">بدون صورة</div>`;
  }

  async function loadSettings(){
    const { data } = await sb.from("salon_settings")
      .select("*")
      .eq("salon_id", user.salon_id)
      .single();

    if (!data) return;
    qs("#auto_confirm").value = String(!!data.auto_confirm_bookings);
    qs("#min_booking_hours").value = data.min_booking_hours;
    qs("#cancel_before_hours").value = data.cancel_before_hours;
    qs("#slot_step_minutes").value = data.slot_step_minutes;
  }

  qs("#btnUploadSalon").onclick = async ()=>{
    const file = qs("#salonImg").files?.[0];
    if (!file) return toast("اختر صورة أولًا", "error");

    try{
      const path = `${user.salon_id}/cover.jpg`;
      await sb.storage.from("salons").upload(path, file, { upsert:true });

      const { data } = sb.storage.from("salons").getPublicUrl(path);
      await sb.from("salons").update({ image_url:data.publicUrl }).eq("id", user.salon_id);

      toast("تم تحديث صورة الصالون");
      loadSalon();
    }catch{
      toast("تعذر رفع الصورة، حاول مرة أخرى", "error");
    }
  };

  qs("#btnSaveSettings").onclick = async ()=>{
    await sb.from("salon_settings").upsert({
      salon_id:user.salon_id,
      auto_confirm_bookings: qs("#auto_confirm").value==="true",
      min_booking_hours:Number(qs("#min_booking_hours").value),
      cancel_before_hours:Number(qs("#cancel_before_hours").value),
      slot_step_minutes:Number(qs("#slot_step_minutes").value),
    },{ onConflict:"salon_id" });

    toast("تم حفظ الإعدادات");
  };

  loadSalon();
  loadSettings();
</script>
</body>
</html>
