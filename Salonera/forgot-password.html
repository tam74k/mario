<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نسيت كلمة المرور</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="container row-between" style="padding:14px 16px">
      <div class="brand">PremiumVIP Booking</div>
      <div class="row"><a class="btn btn-link" href="login.html">رجوع</a></div>
    </div>
  </div>

  <div class="container full-height center">
    <div class="auth-wrap card card-pad">
      <h2 style="margin:0 0 6px 0">استعادة كلمة المرور</h2>
      <div class="muted small">سنرسل لك رابطًا لتعيين كلمة مرور جديدة.</div>
      <div class="hr"></div>

      <label class="label">البريد الإلكتروني</label>
      <input id="email" class="input" type="email" placeholder="name@email.com" />

      <div style="height:12px"></div>
      <button id="btnSend" class="btn btn-primary" style="width:100%">إرسال الرابط</button>
      <div style="height:10px"></div>
      <div class="small muted">تحقق من صندوق البريد والـ Spam.</div>
    </div>
  </div>

  <script type="module">
    import { sb } from "./assets/supabaseClient.js";
    import { RESET_PASSWORD_REDIRECT } from "./assets/config.js";
    import { toast, qs } from "./assets/ui.js";

    

    qs("#btnSend").addEventListener("click", async () => {
      const email = qs("#email").value.trim();
      if (!email) return toast("أدخل البريد الإلكتروني", "error");

      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_PASSWORD_REDIRECT });
      if (error) return toast(error.message, "error");

      toast("تم إرسال الرابط إلى بريدك");
    });
  </script>
  <div class="footer container">© PremiumVIP Booking — واجهة HTML/CSS/JS متصلة بـ Supabase</div>
  <div class="toast"></div>
</body>
</html>
